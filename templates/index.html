<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Search Engine</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:'Poppins',sans-serif;
            background:#0f172a;
            min-height:100vh;
            overflow:hidden;
            color:white;
        }

        .bg{
            position:absolute;
            width:100%;
            height:100%;
            background:linear-gradient(135deg,#020617,#0f172a,#1e3a8a);
            z-index:-1;
        }

        .container{
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            padding:20px;
        }

        .search-box{
            width:100%;
            max-width:650px;
            background:rgba(15,23,42,0.9);
            border:1px solid rgba(255,255,255,0.1);
            backdrop-filter:blur(15px);
            border-radius:25px;
            padding:50px;
            box-shadow:0 10px 40px rgba(0,0,0,0.5);
            text-align:center;
        }

        h1{
            font-size:38px;
            margin-bottom:15px;
            color:#60a5fa;
        }

        .desc{
            color:#cbd5e1;
            margin-bottom:35px;
            font-size:15px;
        }

        input{
            width:100%;
            padding:18px 25px;
            border-radius:50px;
            border:none;
            outline:none;
            background:#1e293b;
            color:white;
            font-size:16px;
            margin-bottom:25px;
            border:2px solid transparent;
            transition:0.3s;
        }

        input:focus{
            border-color:#3b82f6;
            box-shadow:0 0 15px rgba(59,130,246,0.4);
        }

        button{
            background:linear-gradient(135deg,#2563eb,#1d4ed8);
            color:white;
            border:none;
            padding:16px 40px;
            border-radius:50px;
            font-size:16px;
            font-weight:600;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            transform:translateY(-3px);
            box-shadow:0 10px 25px rgba(37,99,235,0.5);
        }

    </style>
</head>

<body>

<div class="bg"></div>

<div class="container">

    <div class="search-box">

        <h1>📰 News Search Engine</h1>

        <p class="desc">
            Cari berita tercepat menggunakan algoritma BM25 dan Inverted Index
        </p>

        <form action="/search" method="POST">

            <input
                type="text"
                name="query"
                placeholder="Cari berita teknologi, politik, ekonomi..."
                required
            >

            <button type="submit">
                Cari Berita
            </button>

        </form>

    </div>

</div>

</body>
</html>
