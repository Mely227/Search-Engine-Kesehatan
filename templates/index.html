<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health News Search Engine</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Reset Dasar */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Latar Belakang Halaman */
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f0fdfa 0%, #ecfeff 50%, #f0f9ff 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #334155;
            position: relative;
            overflow-x: hidden;
        }

        /* Dekorasi Lingkaran Latar Belakang */
        .bg-shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            z-index: -1;
        }

        .shape-1 {
            width: 500px;
            height: 500px;
            background: #99f6e4;
            top: -150px;
            left: -150px;
            animation: float 8s ease-in-out infinite;
        }

        .shape-2 {
            width: 400px;
            height: 400px;
            background: #bae6fd;
            bottom: -100px;
            right: -100px;
            animation: float 10s ease-in-out infinite reverse;
        }

        .shape-3 {
            width: 300px;
            height: 300px;
            background: #fed7aa;
            top: 50%;
            right: 10%;
            opacity: 0.5;
            animation: float 12s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, -30px); }
        }

        /* Ikon-Ikon Melayang (Floating Icons) */
        .floating-icon {
            position: absolute;
            font-size: 40px;
            opacity: 0.15;
            color: #0d9488;
            z-index: 0;
            animation: floatIcon 6s ease-in-out infinite;
        }

        .icon-1 { top: 15%; left: 10%; font-size: 50px; animation-delay: 0s; }
        .icon-2 { top: 20%; right: 15%; font-size: 35px; animation-delay: 1s; }
        .icon-3 { bottom: 20%; left: 8%; font-size: 45px; animation-delay: 2s; }
        .icon-4 { bottom: 25%; right: 10%; font-size: 30px; animation-delay: 3s; }
        .icon-5 { top: 50%; left: 3%; font-size: 25px; animation-delay: 4s; }

        @keyframes floatIcon {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }

        /* Container Utama */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 1;
            padding: 20px;
            width: 100%;
            max-width: 800px;
        }

        /* Header / Logo Section */
        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-icon {
            font-size: 60px;
            margin-bottom: 15px;
            animation: bounce 2s infinite;
            display: inline-block;
            background: white;
            width: 100px;
            height: 100px;
            line-height: 100px;
            border-radius: 50%;
            box-shadow: 0 10px 30px rgba(13, 148, 136, 0.2);
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-15px);}
            60% {transform: translateY(-7px);}
        }

        h1 {
            font-size: 36px;
            color: #0f766f;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.05);
        }

        .subtitle {
            color: #64748b;
            font-size: 16px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .badge {
            background: #ccfbf1;
            color: #0d9488;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        /* Kotak Pencarian (Search Box) */
        .search-box {
            width: 100%;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
        }

        /* Input Group */
        .input-group {
            position: relative;
            margin-bottom: 15px;
        }

        input[type="text"] {
            width: 100%;
            padding: 20px 25px 20px 55px; /* Extra left padding for icon */
            border-radius: 50px;
            border: 2px solid #e2e8f0;
            background: #f8fafc;
            color: #334155;
            font-size: 16px;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
            outline: none;
        }

        input[type="text"]::placeholder {
            color: #94a3b8;
        }

        input[type="text"]:focus {
            background: #ffffff;
            border-color: #14b8a6;
            box-shadow: 0 0 0 6px rgba(20, 184, 166, 0.15);
        }

        /* Ikon di dalam input */
        .input-icon {
            position: absolute;
            left: 22px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 18px;
            transition: 0.3s;
        }

        input:focus + .input-icon {
            color: #14b8a6;
        }

        /* Button Styling */
        button {
            background: linear-gradient(135deg, #14b8a6 0%, #0d9488 100%);
            color: white;
            border: none;
            padding: 18px 40px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 10px 25px rgba(13, 148, 136, 0.25);
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(13, 148, 136, 0.4);
        }

        button:active {
            transform: scale(0.98);
        }

        /* Quick Links / Tags contoh pencarian */
        .quick-search {
            margin-top: 20px;
            text-align: center;
        }

        .quick-search span {
            font-size: 13px;
            color: #94a3b8;
            margin-right: 10px;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
        }

        .tag {
            background: white;
            border: 1px solid #e2e8f0;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            color: #64748b;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tag:hover {
            background: #14b8a6;
            color: white;
            border-color: #14b8a6;
        }

        /* Footer kecil */
        .footer {
            margin-top: 40px;
            font-size: 13px;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .heart {
            color: #ef4444;
            animation: heartbeat 1.5s infinite;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        /* Responsif HP */
        @media (max-width: 600px) {
            .search-box {
                padding: 30px 20px;
            }
            h1 {
                font-size: 28px;
            }
            .floating-icon {
                display: none; /* Sembunyikan ikon melayang di HP agar tidak mengganggu */
            }
        }
    </style>
</head>
<body>

    <!-- Elemen Dekoratif Background -->
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>
    <div class="bg-shape shape-3"></div>

    <!-- Ikon-Ikon Melayang (Floating Icons) -->
    <div class="floating-icon icon-1"><i class="fas fa-user-md"></i></div>
    <div class="floating-icon icon-2"><i class="fas fa-pills"></i></div>
    <div class="floating-icon icon-3"><i class="fas fa-heartbeat"></i></div>
    <div class="floating-icon icon-4"><i class="fas fa-ribbon"></i></div>
    <div class="floating-icon icon-5"><i class="fas fa-capsules"></i></div>

    <div class="container">

        <!-- Header -->
        <div class="header">
            <div class="logo-icon">🩺</div>
            <h1>Health News</h1>
            <p class="subtitle">
                Pencarian Berita Kesehatan Terpercaya
                <span class="badge">BM25 Engine</span>
            </p>
        </div>

        <!-- Kotak Pencarian -->
        <div class="search-box">
            <form action="/search" method="POST">
                <div class="input-group">
                    <input
                        type="text"
                        name="query"
                        placeholder="Cari topik kesehatan, penyakit, atau tips..."
                        required
                    >
                    <i class="fas fa-search input-icon"></i>
                </div>

                <button type="submit">
                    <i class="fas fa-search"></i>
                    Cari Berita
                </button>
            </form>

            <!-- Tags Pencarian Cepat -->
            <div class="quick-search">
                <span>Coba cari:</span>
                <div class="tags">
                    <div class="tag">🦠 Covid-19</div>
                    <div class="tag">💉 Vaccine</div>
                    <div class="tag">🧠 Brain Health</div>
                    <div class="tag">🍎 Nutrition</div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <span>Made with</span>
            <i class="fas fa-heart heart"></i>
            <span>for Health</span>
        </div>

    </div>

</body>
</html>
